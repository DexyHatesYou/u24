<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — BookShelf</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
        (function() {
            var t = localStorage.getItem('bookshelf-theme');
            if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
        })();
    </script>
</head>
<body>

<div class="page-wrapper">

    <header class="site-header">
        <a href="preview.html" class="logo">
            <i data-lucide="book-marked"></i>
            Book<span>Shelf</span>
        </a>
        <nav class="header-nav">
            <a href="preview.html" class="nav-link">
                <i data-lucide="library"></i> Library
            </a>
            <a href="preview_admin.html" class="nav-link active">
                <i data-lucide="settings"></i> Admin
            </a>
            <span class="nav-user">
                <i data-lucide="user"></i>
                admin
            </span>
            <a href="preview_login.html" class="nav-link nav-link--logout">
                <i data-lucide="log-out"></i> Logout
            </a>
            <button id="theme-toggle" class="theme-toggle" title="Toggle theme">
                <i data-lucide="sun" class="icon-sun"></i>
                <i data-lucide="moon" class="icon-moon"></i>
            </button>
        </nav>
    </header>

    <main class="main-content">

        <div class="page-title-row">
            <h1>
                <i data-lucide="settings"></i>
                Admin Panel
            </h1>
        </div>

        <div class="admin-stats">
            <div class="stat-card card">
                <i data-lucide="book-open"></i>
                <div class="stat-card__body">
                    <span class="stat-card__value">8</span>
                    <span class="stat-card__label">Books in Collection</span>
                </div>
            </div>
            <div class="stat-card card">
                <i data-lucide="user-check"></i>
                <div class="stat-card__body">
                    <span class="stat-card__value">admin</span>
                    <span class="stat-card__label">Logged in as</span>
                </div>
            </div>
        </div>

        <div class="admin-sections">

            <!-- Add New Book -->
            <div class="admin-section card" id="add-book">
                <h2 class="admin-section__title">
                    <i data-lucide="plus-circle"></i>
                    Add New Book
                </h2>

                <!-- Sample success (uncomment to preview) -->
                <!-- <div class="alert alert-success">Book "The Pragmatic Programmer" added successfully.</div> -->

                <!-- Sample errors (uncomment to preview) -->
                <!-- <div class="alert alert-error">
                    <ul class="error-list">
                        <li>Title is required.</li>
                        <li>Rating must be between 0 and 5.</li>
                    </ul>
                </div> -->

                <form onsubmit="return false;">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="title">Title <span class="required">*</span></label>
                            <input type="text" id="title" class="form-control" placeholder="e.g. The Pragmatic Programmer">
                        </div>
                        <div class="form-group">
                            <label for="author">Author <span class="required">*</span></label>
                            <input type="text" id="author" class="form-control" placeholder="e.g. David Thomas">
                        </div>
                    </div>

                    <div class="form-row form-row--narrow">
                        <div class="form-group">
                            <label for="release_year">Release Year <span class="required">*</span></label>
                            <input type="number" id="release_year" class="form-control" placeholder="e.g. 2019">
                        </div>
                        <div class="form-group">
                            <label for="rating">Rating (0–5) <span class="required">*</span></label>
                            <input type="number" id="rating" class="form-control" placeholder="e.g. 4.5" step="0.1" min="0" max="5">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="annotation">Annotation</label>
                        <textarea id="annotation" class="form-control" placeholder="Brief description of the book (optional)"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <i data-lucide="plus"></i>
                        Add Book
                    </button>
                </form>
            </div>

            <!-- JSON Import placeholder -->
            <div class="admin-section card" id="import-json">
                <h2 class="admin-section__title">
                    <i data-lucide="upload"></i>
                    Import from JSON
                </h2>
                <p class="admin-section__desc">JSON import will be built in the next step.</p>
            </div>

            <!-- Change Password placeholder -->
            <div class="admin-section card" id="change-password">
                <h2 class="admin-section__title">
                    <i data-lucide="key"></i>
                    Change Password
                </h2>

                <form onsubmit="return false;">
                    <div class="form-group">
                        <label for="current_password">Current Password <span class="required">*</span></label>
                        <input type="password" id="current_password" class="form-control">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="new_password">New Password <span class="required">*</span></label>
                            <input type="password" id="new_password" class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="confirm_password">Confirm New Password <span class="required">*</span></label>
                            <input type="password" id="confirm_password" class="form-control">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <i data-lucide="check-circle"></i>
                        Update Password
                    </button>
                </form>
            </div>

        </div>

    </main>

    <footer class="site-footer">
        &copy; 2026 BookShelf &mdash; Book Management System
    </footer>

</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
